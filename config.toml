# ==========================================================
#  SQL Coverage Finder 設定檔
#  改完存檔後，雙擊 run.bat 即可執行。
#  可用記事本編輯，存成 UTF-8 或 UTF-8 (BOM) 都可以。
# ==========================================================

# 要掃描的資料夾（會連同子目錄一起掃描）
# Windows 路徑請用「單引號」，反斜線不用改：'U:\Project\SQL'
folders = [
  'U:\Project\SQL',
  'U:\Batch\SQL',
  'D:\Work\SQL',
]

# 需求欄位：中文、英文、中英混合都可以，不分大小寫
fields = [
  "交易序號",
  "帳號",
  "客戶統編",
  "交易日期",
  "交易金額",
  "幣別",
  "分行代號",
  "ACCOUNT_NO",
  "TXN_TYPE",
  "BRANCH_CODE",
]

# 一組最多幾支檔案（3～5 通常就夠）
max_files = 5

# 顯示前幾組結果
top = 5

# 要掃描的副檔名（不分大小寫）
extensions = [".sql", ".txt"]

# result.txt（與 report.html）的存放資料夾（"." 代表目前資料夾）
output_dir = "."

# 是否另外產生暗色主題的 report.html（result.txt 一定會產生）
html = false

